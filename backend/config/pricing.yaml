# Token pricing table (USD per 1k tokens) used by app/ai/cost.py.
# Mock uses the same illustrative rates as `default` so the inspector
# can show real token and cost totals in keyless demo runs.
models:
  default:
    prompt_per_1k: 0.00015
    completion_per_1k: 0.00060
  glm-5.3-flash:
    prompt_per_1k: 0.00010
    completion_per_1k: 0.00040
  z-ai/glm-5.3-flash:
    prompt_per_1k: 0.00010
    completion_per_1k: 0.00040
  meta/muse-spark-1.3-contributor:
    prompt_per_1k: 0.00010
    completion_per_1k: 0.00020
  meta/muse-spark-1.3:
    prompt_per_1k: 0.00125
    completion_per_1k: 0.00425
  mock:
    prompt_per_1k: 0.00015
    completion_per_1k: 0.00060
  # Voyage embeddings are input-only. $0.02 / 1M tokens = $0.00002 / 1k.
  voyage-3.5-lite:
    prompt_per_1k: 0.00002
    completion_per_1k: 0.0
  voyage-3.5:
    prompt_per_1k: 0.00006
    completion_per_1k: 0.0
  voyage-4-large:
    prompt_per_1k: 0.00012
    completion_per_1k: 0.0
  hash:
    prompt_per_1k: 0.0
    completion_per_1k: 0.0
